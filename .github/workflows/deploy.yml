# Student capstone deploy.
#
# Every push to main: builds the Docker image (from web/) IN Azure Container
# Registry (no Docker needed in the runner, no registry password anywhere),
# then points the Container App at the new image.
#
# Image tag includes run_id (not just the commit sha): a rerun of the same
# commit needs a distinct tag too, or Container Apps sees an unchanged image
# reference and silently skips creating a new revision/replica.
#
# Setup (once, done for you at onboarding): five repo VARIABLES (not secrets —
# none of these values are secret):
#   AZURE_CLIENT_ID        — your CI identity (id-gh-<you>)
#   AZURE_TENANT_ID        — shared
#   AZURE_SUBSCRIPTION_ID  — shared
#   ACR_NAME               — the shared registry name
#   STUDENT                — your roster name (also your app + hostname)
#   APP_BASE_URL           — this app's real deployed URL (Auth0 needs this,
#                            e.g. https://macromap.apps.human-angle.com)
#
# Auth0 migration (0034_auth0_identity_swap.sql) added four new SECRETS that
# must be set via `gh secret set` before this workflow will produce a working
# deploy — without them every login attempt fails in production:
#   AUTH0_DOMAIN, AUTH0_CLIENT_ID, AUTH0_CLIENT_SECRET, AUTH0_SECRET
# Also update the Auth0 Application's Allowed Callback/Logout URLs to include
# APP_BASE_URL, not just localhost, before the first real deploy under this.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}  # manual redeploy (e.g. after rotating a secret/variable) without needing a new commit

permissions:
  id-token: write   # OIDC token for azure/login — this is the whole auth story
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image (in ACR)
        run: |
          az acr build --registry ${{ vars.ACR_NAME }} \
            --image ${{ vars.STUDENT }}/web:${{ github.sha }}-${{ github.run_id }} \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }} \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }} \
            ./web

      - name: Sync app config
        # KEEP_ALIVE_TIMEOUT (2026-08-09): a real user hit the Regenerate
        # button getting stuck on a slow plan generation, root-caused to a
        # request timing out at exactly ~120s (measured live, 3 separate
        # times) -- a suspiciously precise match to a long-running-request
        # timeout somewhere in front of the app, not the app's own code.
        # Next's standalone-mode generated server.js already reads this
        # exact env var and passes it into startServer()'s keepAliveTimeout
        # option -- raised here as a live experiment (300000ms = 5min) to
        # test whether it's actually the lever controlling this, before
        # assuming Azure Container Apps' own ingress enforces a fixed,
        # non-configurable limit instead (its ARM ingress schema exposes no
        # timeout property at all, checked across several API versions).
        run: |
          az containerapp secret set \
            --resource-group rg-students-platform \
            --name ca-${{ vars.STUDENT }} \
            --secrets \
              supabase-service-role-key="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              anthropic-api-key="${{ secrets.ANTHROPIC_API_KEY }}" \
              spoonacular-api-key="${{ secrets.SPOONACULAR_API_KEY }}" \
              tavily-api-key="${{ secrets.TAVILY_API_KEY }}" \
              auth0-domain="${{ secrets.AUTH0_DOMAIN }}" \
              auth0-client-id="${{ secrets.AUTH0_CLIENT_ID }}" \
              auth0-client-secret="${{ secrets.AUTH0_CLIENT_SECRET }}" \
              auth0-secret="${{ secrets.AUTH0_SECRET }}"
          az containerapp update \
            --resource-group rg-students-platform \
            --name ca-${{ vars.STUDENT }} \
            --set-env-vars \
              SUPABASE_SERVICE_ROLE_KEY=secretref:supabase-service-role-key \
              ANTHROPIC_API_KEY=secretref:anthropic-api-key \
              SPOONACULAR_API_KEY=secretref:spoonacular-api-key \
              TAVILY_API_KEY=secretref:tavily-api-key \
              AUTH0_DOMAIN=secretref:auth0-domain \
              AUTH0_CLIENT_ID=secretref:auth0-client-id \
              AUTH0_CLIENT_SECRET=secretref:auth0-client-secret \
              AUTH0_SECRET=secretref:auth0-secret \
              APP_BASE_URL=${{ vars.APP_BASE_URL }} \
              KEEP_ALIVE_TIMEOUT=300000

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --resource-group rg-students-platform \
            --name ca-${{ vars.STUDENT }} \
            --image ${{ vars.ACR_NAME }}.azurecr.io/${{ vars.STUDENT }}/web:${{ github.sha }}-${{ github.run_id }}
